org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The Play Store application id (Android package name). It cannot change after
# the first upload, and it must match the Android app registered in Firebase.
automa.applicationId=com.corxlabs.automa
automa.versionCode=27
automa.versionName=1.9.5

# Obfuscate aggressively in release builds (also the AGP default).
android.enableR8.fullMode=true
