[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "imagenery"
dynamic = ["version"]
description = "Imagenery (IMY): a strict blueprint compiler. Invent your own syntax, code every mechanic, and IMY validates, compiles and runs it in Python, JavaScript, Lua, Rust, HTML and more."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Imagenery contributors" }]
keywords = ["compiler", "transpiler", "dsl", "llm", "cli", "code-generation", "imy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Compilers",
  "Typing :: Typed",
]
dependencies = [
  "anthropic>=2.0,<3",
  "httpx2>=2.0,<3",
  "pydantic>=2.6,<3",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
imy = "imy.cli:main"

[project.urls]
Homepage = "https://github.com/Wisk-inc/paperclip"
Source = "https://github.com/Wisk-inc/paperclip"
Issues = "https://github.com/Wisk-inc/paperclip/issues"

[tool.hatch.version]
path = "src/imy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/imy"]

[tool.hatch.build.targets.sdist]
include = ["src/imy", "tests", "examples/README.md", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real AI provider (run with --live)"]
addopts = "-ra"
