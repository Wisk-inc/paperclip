name: Publish imagenery to PyPI

# Publishes imy-engine/ (the `imagenery` package, `imy` command) to PyPI with
# Trusted Publishing: GitHub's OIDC identity is exchanged for a short-lived
# upload token, so no PyPI token is stored anywhere.
#
# One-time setup on pypi.org (Account settings > Publishing > Add a new pending
# publisher): PyPI project name `imagenery`, owner `Wisk-inc`, repository
# `paperclip`, workflow name `publish-imagenery.yml`, environment `pypi`.
#
# Release: bump __version__ in imy-engine/src/imy/__init__.py, rebuild the wheel
# shipped in server/src/services/scripts/terminals/imy/, then push the tag
# imagenery-v<version> (for example imagenery-v1.0.0).

on:
  push:
    tags:
      - "imagenery-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-imagenery
  cancel-in-progress: false

jobs:
  publish:
    name: Test, build and publish imagenery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/project/imagenery/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the tag names this version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        working-directory: imy-engine
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import re; print(re.search(r"__version__ = \"([^\"]+)\"", open("src/imy/__init__.py").read()).group(1))')"
          if [ "$TAG" != "imagenery-v$version" ]; then
            echo "The tag $TAG does not match imy-engine's version $version (expected imagenery-v$version)." >&2
            exit 1
          fi

      - name: Run the tests
        working-directory: imy-engine
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -e ".[dev]" build "twine>=6.1"
          .venv/bin/python -m pytest -q

      - name: Build and check the distributions
        working-directory: imy-engine
        run: |
          .venv/bin/python -m build --outdir dist .
          .venv/bin/twine check --strict dist/*
          ls -l dist

      - name: Publish to PyPI (Trusted Publishing, no stored token)
        working-directory: imy-engine
        run: .venv/bin/twine upload --non-interactive dist/*
